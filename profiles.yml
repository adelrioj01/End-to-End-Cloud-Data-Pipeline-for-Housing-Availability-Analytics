housing_analytics:
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET_ANALYTICS', 'housing_analytics') }}"
      threads: 4
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      maximum_bytes_billed: 1000000000
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
