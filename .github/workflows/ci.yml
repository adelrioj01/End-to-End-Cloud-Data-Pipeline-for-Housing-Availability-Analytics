name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  airflow:
    name: Airflow DAG validation
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__UNIT_TEST_MODE: "true"
      GCP_PROJECT_ID: ci-project
      GCS_BUCKET_RAW: ci-housing-raw
      BQ_DATASET_RAW: housing_raw
      BQ_DATASET_ANALYTICS: housing_analytics
      BQ_LOCATION: US
      GOOGLE_APPLICATION_CREDENTIALS_HOST: /tmp/ci-adc.json
      AIRFLOW_ADMIN_PASSWORD: ci-only-password
      AIRFLOW_WEBSERVER_SECRET_KEY: ci-only-webserver-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-airflow.txt

      - name: Install Airflow dependencies
        run: >-
          pip install -r requirements-airflow.txt
          --constraint
          https://raw.githubusercontent.com/apache/airflow/constraints-2.8.0/constraints-3.11.txt

      - name: Check DAG syntax
        run: python -m py_compile dags/housing_analytics_pipeline.py

      - name: Import and validate DAG
        shell: bash
        run: |
          python - <<'PY'
          from dags.housing_analytics_pipeline import dag

          assert dag.dag_id == "housing_analytics_pipeline"
          assert len(dag.tasks) == 13, f"Expected 13 tasks, found {len(dag.tasks)}"
          print(f"Validated {dag.dag_id} with {len(dag.tasks)} tasks")
          PY

  dbt:
    name: dbt project validation
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ci-project
      BQ_DATASET_RAW: housing_raw
      BQ_DATASET_ANALYTICS: housing_analytics
      BQ_LOCATION: US
      DBT_TARGET: dev
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/ci-adc.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: pip install -r requirements-dbt.txt

      - name: Create non-production parse credentials
        shell: bash
        run: |
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'JSON'
          {
            "type": "authorized_user",
            "client_id": "ci-static-parse",
            "client_secret": "ci-static-parse",
            "refresh_token": "ci-static-parse"
          }
          JSON

      - name: Validate dbt project
        shell: bash
        run: |
          set +e
          dbt parse --profiles-dir . --no-partial-parse 2>&1 | tee dbt-parse.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 20 dbt-parse.log | tr '\n' ' ')
            echo "::error title=dbt parse failed::$message"
            exit "$status"
          fi
