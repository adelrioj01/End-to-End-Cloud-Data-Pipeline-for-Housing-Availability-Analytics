<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Housing analytics pipeline architecture</title>
  <desc id="desc">CSV files flow through Cloud Storage and BigQuery raw tables into dbt staging, intermediate and mart models, then Looker Studio. Airflow orchestrates the pipeline and Terraform manages the Google Cloud infrastructure.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .heading { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #64748b; }
      .section { font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; fill: #475569; }
      .card-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .card-text { font: 400 13px Arial, sans-serif; fill: #475569; }
      .chip { font: 600 12px Arial, sans-serif; fill: #334155; }
      .service-title { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .service-text { font: 400 13px Arial, sans-serif; fill: #e0e7ff; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .control { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="760" rx="24" fill="url(#background)"/>
  <text x="70" y="62" class="heading">Housing Availability Analytics</text>
  <text x="70" y="89" class="subtitle">End-to-end batch data pipeline on Google Cloud</text>

  <text x="70" y="142" class="section">DATA FLOW</text>

  <!-- Source files -->
  <g filter="url(#shadow)">
    <rect x="55" y="175" width="190" height="185" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <circle cx="96" cy="215" r="20" fill="#dcfce7"/>
  <path d="M88 204h13l8 8v17H88z M101 204v9h8" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="126" y="221" class="card-title">CSV sources</text>
  <text x="78" y="262" class="card-text">raw_students.csv</text>
  <text x="78" y="286" class="card-text">raw_buildings.csv</text>
  <text x="78" y="310" class="card-text">raw_rooms.csv</text>
  <text x="78" y="334" class="card-text">raw_assignments.csv</text>

  <!-- GCS -->
  <g filter="url(#shadow)">
    <rect x="300" y="195" width="190" height="145" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  </g>
  <circle cx="341" cy="235" r="20" fill="#dbeafe"/>
  <path d="M329 244h25c7 0 9-10 3-13-1-10-15-12-19-4-8-2-13 9-9 17z" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="371" y="241" class="card-title">Cloud Storage</text>
  <text x="324" y="282" class="card-text">Raw object landing zone</text>
  <rect x="324" y="301" width="142" height="22" rx="11" fill="#eff6ff"/>
  <text x="395" y="316" text-anchor="middle" class="chip">housing-raw bucket</text>

  <!-- BigQuery raw -->
  <g filter="url(#shadow)">
    <rect x="545" y="175" width="205" height="185" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  </g>
  <circle cx="586" cy="215" r="20" fill="#dbeafe"/>
  <path d="M576 207h20v16h-20z M580 211h12 M580 216h12" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="616" y="221" class="card-title">BigQuery raw</text>
  <text x="569" y="258" class="card-text">raw_students</text>
  <text x="569" y="282" class="card-text">raw_buildings</text>
  <text x="569" y="306" class="card-text">raw_rooms</text>
  <text x="569" y="330" class="card-text">raw_assignments</text>

  <!-- dbt -->
  <g filter="url(#shadow)">
    <rect x="805" y="155" width="330" height="225" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  </g>
  <circle cx="846" cy="198" r="20" fill="#ffedd5"/>
  <path d="M834 198h24 M846 186v24 M838 190l16 16 M854 190l-16 16" stroke="#ea580c" stroke-width="2"/>
  <text x="876" y="204" class="card-title">dbt transformations</text>
  <rect x="829" y="238" width="282" height="36" rx="10" fill="#fff7ed"/>
  <text x="849" y="261" class="chip">Staging</text>
  <text x="927" y="261" class="card-text">typed, cleaned source views</text>
  <rect x="829" y="286" width="282" height="36" rx="10" fill="#fff7ed"/>
  <text x="849" y="309" class="chip">Intermediate</text>
  <text x="944" y="309" class="card-text">joins and occupancy logic</text>
  <rect x="829" y="334" width="282" height="36" rx="10" fill="#fff7ed"/>
  <text x="849" y="357" class="chip">Marts</text>
  <text x="903" y="357" class="card-text">analytics-ready facts</text>

  <!-- Looker -->
  <g filter="url(#shadow)">
    <rect x="1190" y="195" width="195" height="145" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
  </g>
  <circle cx="1231" cy="235" r="20" fill="#dcfce7"/>
  <path d="M1221 246v-8h5v8z M1229 246v-15h5v15z M1237 246v-22h5v22z" fill="#16a34a"/>
  <text x="1261" y="241" class="card-title">Looker Studio</text>
  <text x="1214" y="282" class="card-text">Interactive dashboard</text>
  <text x="1214" y="306" class="card-text">for housing decisions</text>

  <!-- Main arrows -->
  <path d="M245 267 H292" class="flow"/>
  <path d="M490 267 H537" class="flow"/>
  <path d="M750 267 H797" class="flow"/>
  <path d="M1135 267 H1182" class="flow"/>

  <!-- Control plane -->
  <text x="70" y="458" class="section">ORCHESTRATION &amp; INFRASTRUCTURE</text>
  <g filter="url(#shadow)">
    <rect x="175" y="500" width="480" height="165" rx="20" fill="#312e81"/>
  </g>
  <circle cx="226" cy="550" r="24" fill="#4f46e5"/>
  <path d="M214 550h24 M226 538v24 M218 542l16 16 M234 542l-16 16" stroke="#ffffff" stroke-width="2.4"/>
  <text x="265" y="545" class="service-title">Apache Airflow</text>
  <text x="265" y="570" class="service-text">Schedules and orchestrates ingestion, loading,</text>
  <text x="265" y="591" class="service-text">dbt compilation, transformations and tests.</text>
  <rect x="205" y="620" width="420" height="25" rx="12" fill="#4338ca"/>
  <text x="415" y="637" text-anchor="middle" class="service-text">Docker · LocalExecutor · PostgreSQL metadata database</text>

  <g filter="url(#shadow)">
    <rect x="785" y="500" width="480" height="165" rx="20" fill="#0f172a"/>
  </g>
  <circle cx="836" cy="550" r="24" fill="#334155"/>
  <path d="M826 540h20v20h-20z M826 547h20 M833 540v20" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="875" y="545" class="service-title">Terraform</text>
  <text x="875" y="570" class="service-text">Defines and validates the GCP infrastructure:</text>
  <text x="875" y="591" class="service-text">two BigQuery datasets and the Cloud Storage bucket.</text>
  <rect x="815" y="620" width="420" height="25" rx="12" fill="#1e293b"/>
  <text x="1025" y="637" text-anchor="middle" class="service-text">Infrastructure as Code · reviewed plan before apply</text>

  <!-- Control arrows -->
  <path d="M415 500 C415 445 395 420 395 348" class="control"/>
  <path d="M510 500 C650 430 930 440 970 388" class="control"/>
  <path d="M1025 500 C1025 435 648 440 648 368" class="control"/>

  <text x="720" y="724" text-anchor="middle" class="subtitle">Google Cloud project: housing-analytics-dev · BigQuery location: US</text>
</svg>
